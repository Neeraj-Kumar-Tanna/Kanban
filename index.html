<body>
    <main>
        <div id="newtaskDetOut" class="hide">
            <form id="newtaskDetIn" >
                <input type="text" required placeholder="Task name"  />
                <input type="text" required placeholder="Task details" />
                <input type="submit" value="submit">
            </form>
        </div>
        <nav>
            <div><h2>Kanban Board</h2></div>
            <div>
                <button id="addtask">Add new Task</button>
                <button id="deltask">Delete All Tasks</button>
            </div>
            
        </nav>
        <section>
            <div  id="todo" class="task-column">
                <div class="heading">
                    <h5>ToDo</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    
                </div>
            </div>

            <div id="progress" class="task-column">
                <div class="heading">
                    <h5>In Progress</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    
                </div>
            </div>

            <div id="completed" class="task-column">
                <div class="heading">
                    <h5>Completed</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
