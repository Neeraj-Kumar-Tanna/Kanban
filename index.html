<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
</head>
<body>
    <main>
        <div id="newtaskDetOut" class="hide">
            <form id="newtaskDetIn" >
                <input type="text" required placeholder="Task name"  />
                <input type="text" required placeholder="Task details" />
                <input type="submit" value="submit">
            </form>
        </div>
        <nav>
            <div>Kanban</div>
            <div><button id="addtask">Add new Task</button></div>
        </nav>
        <section>
            <div  id="todo" class="task-column">
                <div class="heading">
                    <h5>ToDo</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    <div draggable="true" class="task">
                        <h3>Read Book</h3>
                        <p>read telugu for 1 hour</p>
                        <button>Delete</button>
                    </div>
                    <div draggable="true" class="task">
                        <h3>Read Book</h3>
                        <p>read telugu for 1 hour</p>
                        <button>Delete</button>
                    </div>
                    <div draggable="true" class="task">
                        <h3>Read Book</h3>
                        <p>read telugu for 1 hour</p>
                        <button>Delete</button>
                    </div>
                    
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <h5>In Progress</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    <div draggable="true" class="task">
                        <h3>Read Book</h3>
                        <p>read telugu for 1 hour</p>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
            <div id="completed" class="task-column">
                <div class="heading">
                    <h5>Completed</h5>
                    <div>count</div>
                </div>
                <div class="bottom">
                    <div draggable="true" class="task">
                        <h3>Read Book</h3>
                        <p>read telugu for 1 hour</p>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
